<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema Graph</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface-2: #16213e;
    --border: #2a2a4e;
    --text: #e0e0e0;
    --muted: #8888aa;
    --accent: #4e79a7;
    --pk: #edc948;
    --fk: #76b7b2;
    --uq: #b07aa1;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    overflow: hidden;
  }

  #graph { flex: 1; min-width: 0; position: relative; }
  #graph-message {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
  .graph-controls {
    position: absolute;
    left: 16px;
    bottom: 16px;
    display: flex;
    gap: 8px;
    z-index: 5;
  }

  aside {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    min-height: 0;
  }
  .section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .grow { flex: 1; overflow-y: auto; min-height: 0; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.01em; }
  h2 { font-size: 14px; margin: 0 0 2px; overflow-wrap: anywhere; }
  h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 16px 0 8px;
  }
  h3:first-child { margin-top: 0; }
  .meta { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .hint { color: var(--muted); margin: 0; }

  input, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
  }
  input { width: 100%; }
  button { cursor: pointer; }
  button:hover, input:focus { border-color: var(--accent); outline: none; }
  button:disabled { opacity: 0.4; cursor: default; }
  .graph-controls button { background: rgba(26, 26, 46, 0.9); backdrop-filter: blur(4px); }

  .search { position: relative; }
  #results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 240px;
    overflow-y: auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: none;
    z-index: 10;
  }
  #results.open { display: block; }
  .result {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: none;
    border-radius: 0;
    background: none;
    text-align: left;
    padding: 6px 10px;
  }
  .result:hover, .result.active { background: var(--border); }

  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td {
    padding: 4px 4px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  td:last-child { white-space: nowrap; width: 1%; text-align: right; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  .type { color: var(--muted); }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 0 4px;
    margin-left: 2px;
    border-radius: 3px;
    border: 1px solid currentColor;
  }
  .badge.pk { color: var(--pk); }
  .badge.fk { color: var(--fk); }
  .badge.uq { color: var(--uq); }

  ul.links { list-style: none; padding: 0; margin: 0; }
  ul.links li { display: flex; align-items: center; gap: 8px; margin: 3px 0; min-width: 0; }
  .link {
    background: none;
    border: none;
    padding: 1px 0;
    color: var(--text);
    text-align: left;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .link:hover { color: #fff; text-decoration: underline; }
  .back { color: var(--muted); margin-bottom: 8px; }
  .count { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    border-radius: 4px;
    padding: 4px 6px;
    text-align: left;
  }
  .legend-item:hover { background: var(--surface-2); }
  .legend-item.off { opacity: 0.35; }
  .legend-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .stat b { display: block; font-size: 16px; }
  .stat span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

  div.vis-tooltip {
    background: var(--surface-2) !important;
    color: var(--text) !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    padding: 6px 8px !important;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
  }

  @media (max-width: 720px) {
    body { flex-direction: column; overflow: auto; }
    #graph { flex: none; height: 60vh; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div id="graph">
  <div id="graph-message"></div>
  <div class="graph-controls">
    <button id="layout" type="button">Tree layout</button>
    <button id="fit" type="button">Fit</button>
  </div>
</div>
<aside>
  <div class="section">
    <h1>Schema graph</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="section search">
    <input id="search" placeholder="Search tables…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="section grow" id="panel"></div>
  <div class="section grow" id="legend-section" style="flex: 0 1 auto; max-height: 30vh;">
    <h3>Clusters</h3>
    <div id="legend"></div>
  </div>
  <div class="section stats" id="stats"></div>
</aside>

<script>
const DATA = /*__DATA__*/null;
</script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
(function () {
  const PALETTE = ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948", "#b07aa1", "#ff9da7", "#9c755f", "#bab0ac"];
  const DIM = "rgba(120, 120, 150, 0.12)";
  const tables = new Map(DATA.tables.map((t) => [t.name, t]));
  const rels = DATA.relationships;
  const panel = document.getElementById("panel");
  const message = document.getElementById("graph-message");
  let network = null;
  let nodes = null;
  let edges = null;
  let selected = null;

  document.getElementById("meta").textContent = `${DATA.database} · ${DATA.generated_at}`;

  // ---- neighbours and clusters ----
  const neighbours = new Map(DATA.tables.map((t) => [t.name, new Set()]));
  for (const r of rels) {
    if (r.from_table === r.to_table) continue;
    neighbours.get(r.from_table).add(r.to_table);
    neighbours.get(r.to_table).add(r.from_table);
  }
  const degree = (name) => neighbours.get(name).size;

  // Louvain-style modularity clustering (local moving phase), visited in a fixed
  // order so the same schema always gets the same clusters.
  const weight = new Map(DATA.tables.map((t) => [t.name, new Map()]));
  for (const r of rels) {
    if (r.from_table === r.to_table) continue;
    for (const [a, b] of [[r.from_table, r.to_table], [r.to_table, r.from_table]]) {
      weight.get(a).set(b, (weight.get(a).get(b) || 0) + 1);
    }
  }
  const strength = new Map([...weight].map(([n, w]) => [n, [...w.values()].reduce((s, x) => s + x, 0)]));
  const twoM = [...strength.values()].reduce((s, x) => s + x, 0);
  const cluster = new Map(DATA.tables.map((t) => [t.name, t.name]));
  const total = new Map(strength);
  const order = DATA.tables.map((t) => t.name).sort((a, b) => degree(b) - degree(a) || a.localeCompare(b));
  for (let round = 0; round < 50 && twoM; round++) {
    let changed = false;
    for (const name of order) {
      if (!degree(name)) continue;
      const k = strength.get(name);
      const own = cluster.get(name);
      total.set(own, total.get(own) - k);
      const links = new Map();
      for (const [n, w] of weight.get(name)) links.set(cluster.get(n), (links.get(cluster.get(n)) || 0) + w);
      let best = own;
      let bestGain = (links.get(own) || 0) - total.get(own) * k / twoM;
      for (const [c, w] of links) {
        const gain = w - total.get(c) * k / twoM;
        if (gain > bestGain + 1e-9) { best = c; bestGain = gain; }
      }
      total.set(best, total.get(best) + k);
      if (best !== own) { cluster.set(name, best); changed = true; }
    }
    if (!changed) break;
  }

  // Each cluster is named after its best-connected table; tables with no links share one group.
  const groups = new Map();
  for (const name of order) {
    const key = degree(name) ? cluster.get(name) : "\u0000isolated";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(name);
  }
  const clusters = [...groups.entries()]
    .sort(([ka, a], [kb, b]) => (ka === "\u0000isolated") - (kb === "\u0000isolated") || b.length - a.length)
    .map(([key, members], i) => ({
      id: i,
      name: key === "\u0000isolated" ? "Unlinked tables" : members[0],
      members,
      color: PALETTE[i % PALETTE.length],
      visible: true,
    }));
  const clusterOf = new Map();
  for (const c of clusters) for (const m of c.members) clusterOf.set(m, c);

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "text") node.textContent = v;
      else if (k === "onclick") node.addEventListener("click", v);
      else if (k === "style") node.style.cssText = v;
      else node.setAttribute(k, v);
    }
    for (const child of children || []) node.appendChild(child);
    return node;
  }

  const dot = (name) => el("span", { class: "dot", style: `background:${clusterOf.get(name).color}` });

  function tableLink(name, text) {
    return el("button", { class: "link", type: "button", text: text || name, onclick: () => select(name, true) });
  }

  function badges(col) {
    const out = [];
    if (col.primary_key) out.push(el("span", { class: "badge pk", text: "PK" }));
    if (col.foreign_key) out.push(el("span", { class: "badge fk", text: "FK" }));
    if (col.unique) out.push(el("span", { class: "badge uq", text: "UQ" }));
    return out;
  }

  function showOverview() {
    const top = [...DATA.tables].sort((a, b) => degree(b.name) - degree(a.name) || a.name.localeCompare(b.name));
    panel.replaceChildren(
      el("h3", { text: "Node info" }),
      el("p", { class: "hint", text: network
        ? "Click a table to see its columns and links. Drag to move, scroll to zoom."
        : "Click a table to see its columns and links." }),
      el("h3", { text: `Tables (${DATA.tables.length})` }),
      el("ul", { class: "links" }, top.map((t) =>
        el("li", {}, [dot(t.name), tableLink(t.name), el("span", { class: "count", text: `${degree(t.name)} links` })])
      )),
    );
  }

  function showTable(name) {
    const t = tables.get(name);
    const c = clusterOf.get(name);
    const rows = t.columns.map((col) => el("tr", {}, [
      el("td", {}, [el("code", { text: col.name })]),
      el("td", {}, [el("code", { class: "type", text: col.type + (col.nullable ? "?" : "") })]),
      el("td", {}, badges(col)),
    ]));
    const outgoing = rels.filter((r) => r.from_table === name);
    const incoming = rels.filter((r) => r.to_table === name);
    const relList = (list, render) => list.length
      ? el("ul", { class: "links" }, list.map(render))
      : el("p", { class: "hint", text: "None" });

    panel.replaceChildren(
      el("button", { class: "link back", type: "button", text: "← All tables", onclick: () => select(null) }),
      el("h2", {}, [dot(name), document.createTextNode(" " + name)]),
      el("div", { class: "meta", text: `${t.columns.length} columns · ${degree(name)} links · cluster ${c.name}` }),
      el("h3", { text: "Columns" }),
      el("table", {}, [el("tbody", {}, rows)]),
      el("h3", { text: `References (${outgoing.length})` }),
      relList(outgoing, (r) => el("li", {}, [
        dot(r.to_table), tableLink(r.to_table, `${r.to_table}.${r.to_column}`),
        el("code", { class: "count", text: r.from_column }),
      ])),
      el("h3", { text: `Referenced by (${incoming.length})` }),
      relList(incoming, (r) => el("li", {}, [
        dot(r.from_table), tableLink(r.from_table, `${r.from_table}.${r.from_column}`),
        el("code", { class: "count", text: `→ ${r.to_column}` }),
      ])),
    );
    panel.scrollTop = 0;
  }

  function select(name, focus) {
    selected = name;
    if (name) showTable(name); else showOverview();
    if (!network) return;
    highlight(name);
    if (name) {
      network.selectNodes([name]);
      if (focus) network.focus(name, { scale: Math.max(network.getScale(), 1), animation: { duration: 500, easingFunction: "easeInOutQuad" } });
    } else {
      network.unselectAll();
    }
  }

  // ---- search ----
  const search = document.getElementById("search");
  const results = document.getElementById("results");
  let matches = [];
  let active = 0;

  function renderResults() {
    results.replaceChildren(...matches.map((name, i) => el("button", {
      class: "result" + (i === active ? " active" : ""), type: "button",
      onclick: () => pick(name),
    }, [dot(name), el("span", { text: name }), el("span", { class: "count", text: `${degree(name)} links` })])));
    results.classList.toggle("open", matches.length > 0);
  }

  function pick(name) {
    search.value = name;
    results.classList.remove("open");
    select(name, true);
  }

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    matches = q ? DATA.tables.map((t) => t.name).filter((n) => n.toLowerCase().includes(q))
      .sort((a, b) => a.toLowerCase().indexOf(q) - b.toLowerCase().indexOf(q) || a.localeCompare(b)).slice(0, 30) : [];
    active = 0;
    renderResults();
  });
  search.addEventListener("keydown", (e) => {
    if (!matches.length) return;
    if (e.key === "ArrowDown") { active = (active + 1) % matches.length; renderResults(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = (active - 1 + matches.length) % matches.length; renderResults(); e.preventDefault(); }
    else if (e.key === "Enter") pick(matches[active]);
    else if (e.key === "Escape") results.classList.remove("open");
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search")) results.classList.remove("open");
  });

  // ---- legend and stats ----
  function renderLegend() {
    document.getElementById("legend").replaceChildren(...clusters.map((c) => el("button", {
      class: "legend-item" + (c.visible ? "" : " off"), type: "button",
      title: c.visible ? "Hide this cluster" : "Show this cluster",
      onclick: () => {
        c.visible = !c.visible;
        renderLegend();
        if (nodes) nodes.update(c.members.map((m) => ({ id: m, hidden: !c.visible })));
      },
    }, [el("span", { class: "dot", style: `background:${c.color}` }), el("span", { class: "name", text: c.name }),
        el("span", { class: "count", text: String(c.members.length) })])));
  }

  const stat = (value, label) => el("div", { class: "stat" }, [el("b", { text: String(value) }), el("span", { text: label })]);
  document.getElementById("stats").replaceChildren(
    stat(DATA.tables.length, "tables"), stat(rels.length, "links"), stat(clusters.length, "clusters"),
  );

  renderLegend();
  showOverview();

  if (DATA.tables.length === 0) {
    message.textContent = "This database has no tables.";
    message.style.display = "flex";
    return;
  }
  if (typeof vis === "undefined") {
    message.textContent = "The graph library could not be loaded (it comes from unpkg.com, so this page needs internet access). The table list on the right still works.";
    message.style.display = "flex";
    document.getElementById("layout").disabled = true;
    document.getElementById("fit").disabled = true;
    return;
  }

  // ---- graph ----
  const maxDegree = Math.max(1, ...DATA.tables.map((t) => degree(t.name)));
  const size = (name) => 10 + 30 * Math.sqrt(degree(name) / maxDegree);

  function nodeStyle(name, state) {
    const c = clusterOf.get(name).color;
    const dimmed = state === "dim";
    return {
      color: {
        background: dimmed ? DIM : c,
        border: state === "active" ? "#ffffff" : dimmed ? "transparent" : c,
        highlight: { background: c, border: "#ffffff" },
        hover: { background: c, border: "#ffffff" },
      },
      borderWidth: state === "active" ? 3 : 1,
      shadow: { enabled: !dimmed, color: c, size: state === "active" ? 30 : 14, x: 0, y: 0 },
      font: { color: dimmed ? "rgba(224, 224, 224, 0.15)" : "#e0e0e0" },
    };
  }

  nodes = new vis.DataSet(DATA.tables.map((t) => ({
    id: t.name,
    label: t.name,
    title: `${t.name}\n${t.columns.length} columns · ${degree(t.name)} links\ncluster: ${clusterOf.get(t.name).name}`,
    shape: "dot",
    size: size(t.name),
    font: { size: 12 + Math.round(6 * degree(t.name) / maxDegree), face: "-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif",
            strokeWidth: 3, strokeColor: "#0f0f1a", vadjust: 2 },
    ...nodeStyle(t.name, "normal"),
  })));

  function edgeStyle(r, state) {
    const c = clusterOf.get(r.from_table).color;
    return {
      color: { color: state === "dim" ? "rgba(120, 120, 150, 0.05)" : state === "active" ? c : "rgba(140, 140, 180, 0.28)",
               highlight: c, hover: c },
      width: state === "active" ? 2.2 : 1,
      label: state === "active" ? `${r.from_column} → ${r.to_column}` : undefined,
    };
  }

  // Several FKs between the same two tables get spread-out curves so they don't overlap.
  const pairCount = new Map();
  edges = new vis.DataSet(rels.map((r, i) => {
    const key = [r.from_table, r.to_table].sort().join("\u0000");
    const n = pairCount.get(key) || 0;
    pairCount.set(key, n + 1);
    return {
      id: i,
      from: r.from_table,
      to: r.to_table,
      title: `${r.from_table}.${r.from_column} → ${r.to_table}.${r.to_column}\n${r.one_to_one ? "one-to-one" : "many-to-one"}`,
      arrows: { to: { enabled: true, scaleFactor: 0.4 } },
      dashes: r.one_to_one,
      smooth: { enabled: true, type: n % 2 ? "curvedCCW" : "curvedCW", roundness: 0.15 + 0.1 * Math.floor(n / 2) },
      font: { size: 10, color: "#c0c0d8", strokeWidth: 3, strokeColor: "#0f0f1a", align: "middle" },
      ...edgeStyle(r, "normal"),
    };
  }));

  const FORCE = {
    // Fixed seed: the same schema always gets the same layout.
    layout: { randomSeed: 7, improvedLayout: true, hierarchical: { enabled: false } },
    physics: {
      enabled: true,
      solver: "forceAtlas2Based",
      forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.01, springLength: 120, springConstant: 0.06, damping: 0.4, avoidOverlap: 0.6 },
      stabilization: { iterations: 500, fit: true },
    },
  };
  const TREE = {
    layout: { hierarchical: { enabled: true, direction: "LR", sortMethod: "directed", levelSeparation: 260, nodeSpacing: 70, treeSpacing: 120 } },
    physics: { enabled: false },
  };

  network = new vis.Network(document.getElementById("graph"), { nodes, edges }, {
    ...FORCE,
    interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: true, navigationButtons: false, keyboard: false },
  });
  // Freeze the layout once it settles so tables stay where you drag them.
  network.on("stabilizationIterationsDone", () => network.setOptions({ physics: { enabled: false } }));

  network.on("click", (p) => {
    if (p.nodes.length) select(p.nodes[0], false);
    else if (!p.edges.length) select(null);
  });

  function highlight(name) {
    const near = name ? neighbours.get(name) : new Set();
    nodes.update(DATA.tables.map((t) => ({
      id: t.name,
      ...nodeStyle(t.name, !name ? "normal" : t.name === name ? "active" : near.has(t.name) ? "normal" : "dim"),
    })));
    edges.update(rels.map((r, i) => ({
      id: i,
      ...edgeStyle(r, !name ? "normal" : r.from_table === name || r.to_table === name ? "active" : "dim"),
    })));
  }

  // Going back from the tree restores the force positions (including any drags)
  // instead of re-simulating, which vis does poorly after a hierarchical layout.
  let tree = false;
  let forcePositions = null;
  const layoutButton = document.getElementById("layout");
  layoutButton.addEventListener("click", () => {
    if (!tree) {
      forcePositions = network.getPositions();
      network.setOptions(TREE);
    } else {
      network.setOptions({ layout: { hierarchical: { enabled: false } }, physics: { enabled: false } });
      for (const [id, pos] of Object.entries(forcePositions)) network.moveNode(id, pos.x, pos.y);
    }
    tree = !tree;
    layoutButton.textContent = tree ? "Force layout" : "Tree layout";
    network.fit({ animation: { duration: 400 } });
  });
  document.getElementById("fit").addEventListener("click", () => network.fit({ animation: { duration: 400 } }));
})();
</script>
</body>
</html>

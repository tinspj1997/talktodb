<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema Graph</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #5d6677;
    --border: #d9dde5;
    --node-bg: #ffffff;
    --node-border: #9aa4b5;
    --accent: #2f6fde;
    --accent-soft: #e4edfc;
    --edge: #8a94a6;
    --pk: #b26a00;
    --fk: #2f6fde;
    --uq: #6a4bc4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b;
      --surface: #1a1e26;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --border: #2d3340;
      --node-bg: #1f2430;
      --node-border: #505a6c;
      --accent: #6d9cf5;
      --accent-soft: #23314d;
      --edge: #6f7a8e;
      --pk: #e3a447;
      --fk: #6d9cf5;
      --uq: #a58bf0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b;
    --surface: #1a1e26;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #2d3340;
    --node-bg: #1f2430;
    --node-border: #505a6c;
    --accent: #6d9cf5;
    --accent-soft: #23314d;
    --edge: #6f7a8e;
    --pk: #e3a447;
    --fk: #6d9cf5;
    --uq: #a58bf0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .title { margin-right: auto; min-width: 0; }
  h1 { font-size: 16px; margin: 0; }
  .meta {
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  input, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  input { width: 220px; max-width: 100%; }
  button { cursor: pointer; }
  button:hover, input:focus { border-color: var(--accent); outline: none; }

  main { flex: 1; display: flex; min-height: 0; }
  #graph { flex: 1; min-width: 0; position: relative; }
  #graph-message {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
  aside {
    width: 340px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 16px;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }
  aside h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
  aside h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  .hint { color: var(--muted); margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  th { color: var(--muted); font-weight: 500; }
  th:last-child, td:last-child { white-space: nowrap; width: 1%; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 0 4px;
    margin-right: 2px;
    border-radius: 4px;
    border: 1px solid currentColor;
  }
  .badge.pk { color: var(--pk); }
  .badge.fk { color: var(--fk); }
  .badge.uq { color: var(--uq); }
  .null { color: var(--muted); }
  ul.links { list-style: none; padding: 0; margin: 0; }
  ul.links li { margin: 2px 0; }
  .link {
    background: none;
    border: none;
    padding: 2px 0;
    color: var(--accent);
    text-align: left;
    overflow-wrap: anywhere;
  }
  .link:hover { text-decoration: underline; }
  .count { color: var(--muted); font-size: 12px; }

  @media (max-width: 720px) {
    main { flex-direction: column; }
    #graph { flex: none; height: 60vh; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--border); }
    input { width: 100%; }
    .controls { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>Schema graph</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="controls">
    <input id="search" list="table-names" placeholder="Find a table…" autocomplete="off">
    <datalist id="table-names"></datalist>
    <button id="layout" type="button">Tree layout</button>
    <button id="fit" type="button">Fit</button>
  </div>
</header>
<main>
  <div id="graph"><div id="graph-message"></div></div>
  <aside id="panel"></aside>
</main>

<script>
const DATA = /*__DATA__*/null;
</script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
(function () {
  const MAX_LABEL_COLUMNS = 12;
  const tables = new Map(DATA.tables.map((t) => [t.name, t]));
  const rels = DATA.relationships;
  const panel = document.getElementById("panel");
  const message = document.getElementById("graph-message");
  let network = null;
  let nodes = null;
  let edges = null;
  let selected = null;

  document.getElementById("meta").textContent =
    `${DATA.database} · ${DATA.tables.length} tables · ${rels.length} relationships · ${DATA.generated_at}`;

  const names = document.getElementById("table-names");
  for (const t of DATA.tables) {
    const option = document.createElement("option");
    option.value = t.name;
    names.appendChild(option);
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "text") node.textContent = v;
      else if (k === "onclick") node.addEventListener("click", v);
      else node.setAttribute(k, v);
    }
    for (const child of children || []) node.appendChild(child);
    return node;
  }

  function tableLink(name, text) {
    return el("button", { class: "link", type: "button", text: text || name, onclick: () => select(name, true) });
  }

  function badges(col) {
    const out = [];
    if (col.primary_key) out.push(el("span", { class: "badge pk", text: "PK" }));
    if (col.foreign_key) out.push(el("span", { class: "badge fk", text: "FK" }));
    if (col.unique) out.push(el("span", { class: "badge uq", text: "UQ" }));
    return out;
  }

  function showOverview() {
    panel.replaceChildren(
      el("h2", { text: "Tables" }),
      el("p", { class: "hint", text: network
        ? "Click a table in the graph or below to see its columns and relationships. Drag to move, scroll to zoom."
        : "Click a table to see its columns and relationships." }),
      el("h3", { text: `All tables (${DATA.tables.length})` }),
      el("ul", { class: "links" }, DATA.tables.map((t) =>
        el("li", {}, [tableLink(t.name), el("span", { class: "count", text: `  ${t.columns.length} columns` })])
      )),
    );
  }

  function showTable(name) {
    const t = tables.get(name);
    const rows = t.columns.map((c) => el("tr", {}, [
      el("td", {}, [el("code", { text: c.name })]),
      el("td", {}, [el("code", { text: c.type }), ...(c.nullable ? [el("span", { class: "null", text: " null" })] : [])]),
      el("td", {}, badges(c)),
    ]));
    const outgoing = rels.filter((r) => r.from_table === name);
    const incoming = rels.filter((r) => r.to_table === name);
    const relList = (list, render) => list.length
      ? el("ul", { class: "links" }, list.map(render))
      : el("p", { class: "hint", text: "None" });

    panel.replaceChildren(
      el("button", { class: "link", type: "button", text: "← All tables", onclick: () => select(null) }),
      el("h2", { text: name }),
      el("div", { class: "count", text: `${t.columns.length} columns` }),
      el("h3", { text: "Columns" }),
      el("table", {}, [
        el("thead", {}, [el("tr", {}, [el("th", { text: "Name" }), el("th", { text: "Type" }), el("th", { text: "Keys" })])]),
        el("tbody", {}, rows),
      ]),
      el("h3", { text: `References (${outgoing.length})` }),
      relList(outgoing, (r) => el("li", {}, [
        el("code", { text: `${r.from_column} → ` }), tableLink(r.to_table, `${r.to_table}.${r.to_column}`),
      ])),
      el("h3", { text: `Referenced by (${incoming.length})` }),
      relList(incoming, (r) => el("li", {}, [
        tableLink(r.from_table, `${r.from_table}.${r.from_column}`), el("code", { text: ` → ${r.to_column}` }),
      ])),
    );
  }

  function select(name, focus) {
    selected = name;
    if (name) showTable(name); else showOverview();
    if (!network) return;
    highlight(name);
    if (name) {
      network.selectNodes([name]);
      if (focus) network.focus(name, { scale: Math.max(network.getScale(), 0.8), animation: { duration: 400 } });
    } else {
      network.unselectAll();
    }
  }

  document.getElementById("search").addEventListener("change", (e) => {
    const value = e.target.value.trim();
    const match = tables.has(value)
      ? value
      : DATA.tables.map((t) => t.name).find((n) => n.toLowerCase().includes(value.toLowerCase()));
    if (value && match) select(match, true);
  });

  showOverview();

  if (DATA.tables.length === 0) {
    message.textContent = "This database has no tables.";
    message.style.display = "flex";
    return;
  }
  if (typeof vis === "undefined") {
    message.textContent = "The graph library could not be loaded (it comes from unpkg.com, so this page needs internet access). The table list on the right still works.";
    message.style.display = "flex";
    document.getElementById("layout").disabled = true;
    document.getElementById("fit").disabled = true;
    return;
  }

  // ---- graph ----
  const css = getComputedStyle(document.documentElement);
  const color = (name) => css.getPropertyValue(name).trim();
  const palette = {
    text: color("--text"), muted: color("--muted"), nodeBg: color("--node-bg"),
    nodeBorder: color("--node-border"), accent: color("--accent"),
    accentSoft: color("--accent-soft"), edge: color("--edge"), bg: color("--bg"),
  };

  function label(t) {
    const shown = t.columns.slice(0, MAX_LABEL_COLUMNS);
    const lines = shown.map((c) => {
      const keys = [c.primary_key && "PK", c.foreign_key && "FK", c.unique && "UQ"].filter(Boolean).join(",");
      return `${c.name} ${c.type}${keys ? " " + keys : ""}`;
    });
    if (t.columns.length > shown.length) lines.push(`… ${t.columns.length - shown.length} more`);
    return `<b>${plain(t.name)}</b>\n${plain(lines.join("\n"))}`;
  }

  // vis-network's label markup reads <b>-style tags but does not decode entities,
  // so angle brackets in names are swapped for look-alikes instead of escaped.
  function plain(s) {
    return s.replace(/</g, "\u2039").replace(/>/g, "\u203a");
  }

  function nodeStyle(dimmed, active) {
    return {
      color: {
        background: active ? palette.accentSoft : palette.nodeBg,
        border: active ? palette.accent : palette.nodeBorder,
        highlight: { background: palette.accentSoft, border: palette.accent },
        hover: { background: palette.nodeBg, border: palette.accent },
      },
      opacity: dimmed ? 0.25 : 1,
      borderWidth: active ? 2 : 1,
    };
  }

  const labels = DATA.tables.map(label);
  nodes = new vis.DataSet(DATA.tables.map((t, i) => ({
    id: t.name,
    label: labels[i],
    shape: "box",
    margin: 10,
    chosen: { node: true, label: false },
    font: { multi: "html", face: "ui-monospace, Menlo, Consolas, monospace", size: 13, color: palette.text, align: "left",
            bold: { face: "system-ui, sans-serif", size: 15, color: palette.text } },
    ...nodeStyle(false, false),
  })));

  // Several FKs between the same two tables get spread-out curves so they don't overlap.
  const pairCount = new Map();
  edges = new vis.DataSet(rels.map((r, i) => {
    const key = [r.from_table, r.to_table].sort().join("\u0000");
    const n = pairCount.get(key) || 0;
    pairCount.set(key, n + 1);
    return {
      id: i,
      from: r.from_table,
      to: r.to_table,
      label: `${r.from_column} → ${r.to_column}`,
      title: `${r.from_table}.${r.from_column} → ${r.to_table}.${r.to_column} (${r.one_to_one ? "one-to-one" : "many-to-one"})`,
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      dashes: r.one_to_one,
      smooth: { enabled: true, type: n % 2 ? "curvedCCW" : "curvedCW", roundness: 0.15 + 0.1 * Math.floor(n / 2) },
      color: { color: palette.edge, highlight: palette.accent, hover: palette.accent },
      font: { size: 11, color: palette.muted, strokeWidth: 4, strokeColor: palette.bg },
      width: 1.2,
    };
  }));

  const FORCE = {
    // Fixed seed: the same schema always gets the same layout.
    layout: { randomSeed: 7, hierarchical: { enabled: false } },
    physics: {
      enabled: true,
      solver: "forceAtlas2Based",
      // Strong repulsion keeps wide tables from overlapping (measured on a 41-table schema).
      forceAtlas2Based: { gravitationalConstant: -400, centralGravity: 0.005, springLength: 320, springConstant: 0.04, avoidOverlap: 1 },
      stabilization: { iterations: 400, fit: true },
    },
  };
  // vis spaces tree levels by fixed pixels, so size the gaps from the biggest table box.
  const maxLines = Math.max(...labels.map((l) => l.split("\n").length));
  const maxChars = Math.max(...labels.map((l) => Math.max(...l.replace(/<\/?b>/g, "").split("\n").map((x) => x.length))));
  const TREE = {
    layout: { hierarchical: {
      enabled: true, direction: "LR", sortMethod: "directed",
      levelSeparation: maxChars * 8 + 140, nodeSpacing: maxLines * 17 + 40, treeSpacing: maxLines * 17 + 80,
    } },
    physics: { enabled: false },
  };

  network = new vis.Network(document.getElementById("graph"), { nodes, edges }, {
    ...FORCE,
    interaction: { hover: true, tooltipDelay: 150, navigationButtons: false, keyboard: false },
  });
  // Freeze the layout once it settles so tables stay where you drag them.
  network.on("stabilizationIterationsDone", () => network.setOptions({ physics: { enabled: false } }));

  network.on("click", (p) => {
    if (p.nodes.length) select(p.nodes[0], false);
    else if (!p.edges.length) select(null);
  });

  function highlight(name) {
    const neighbours = new Set(name ? network.getConnectedNodes(name) : []);
    nodes.update(DATA.tables.map((t) => ({
      id: t.name,
      ...nodeStyle(Boolean(name) && t.name !== name && !neighbours.has(t.name), t.name === name),
    })));
  }

  // Going back from the tree restores the force positions (including any drags)
  // instead of re-simulating, which vis does poorly after a hierarchical layout.
  let tree = false;
  let forcePositions = null;
  const layoutButton = document.getElementById("layout");
  layoutButton.addEventListener("click", () => {
    if (!tree) {
      forcePositions = network.getPositions();
      network.setOptions(TREE);
    } else {
      network.setOptions({ layout: { hierarchical: { enabled: false } }, physics: { enabled: false } });
      for (const [id, pos] of Object.entries(forcePositions)) network.moveNode(id, pos.x, pos.y);
    }
    tree = !tree;
    layoutButton.textContent = tree ? "Force layout" : "Tree layout";
    network.fit({ animation: { duration: 400 } });
  });
  document.getElementById("fit").addEventListener("click", () => network.fit({ animation: { duration: 400 } }));
})();
</script>
</body>
</html>
